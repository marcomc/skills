<div id="project-visual-brief">

    #project-visual-brief { color: var(--foreground); }

    #project-visual-brief [data-state="human"] .pb-state .pb-status-symbol { color: var(--viz-series-2); }
    #project-visual-brief [data-state="done"] .pb-state .pb-status-symbol { color: var(--viz-series-3); }
    #project-visual-brief [data-state="milestone"] .pb-state .pb-status-symbol { color: var(--viz-series-4); }

      #project-visual-brief .pb-meta { display: grid; justify-content: start; }
      #project-visual-brief .pb-lifecycle-row { grid-template-columns: minmax(0, 1fr); gap: calc(var(--font-size-base) * .2); }
      #project-visual-brief .pb-dimension-value { padding-inline-start: calc(var(--font-size-base) * 1.6); }
    }
  </style>

  <script>

      const root = document.getElementById('project-visual-brief');

  ],
  "developmentLabel": "Development",
  "executionLabel": "Execution",
  "unknownDevelopmentLabel": "Not established",
  "builtLabel": "What already exists",
  "buildRemainingLabel": "What remains to finish"
} /* MODEL_END */;
      root.lang = brief.language;
      const icons = { audio: 'mic', video: 'clapperboard', image: 'image', document: 'file-text', data: 'database', infrastructure: 'server', code: 'code-xml', validation: 'clipboard-check', decision: 'user-round', milestone: 'flag', design: 'paintbrush', unknown: 'circle-help' };
      const developmentIcons = { planned: 'clipboard-list', building: 'hammer', partial: 'blocks', implemented: 'code-xml', verified: 'badge-check', unknown: 'circle-help', not_applicable: null };
      const executionIcons = { running: 'timer', waiting: 'hourglass', blocked: 'octagon-pause', human: 'user-round', done: 'circle-check', later: 'clock-3', milestone: 'flag', unknown: 'circle-help' };
      const svg = root.querySelector('.pb-edges');
      const graph = root.querySelector('[data-slot="graph"]');
      const rows = root.querySelector('.pb-rows');
      const nodeMap = new Map(brief.nodes.map(node => [node.id, node]));
      const wrappers = new Map();
      const ns = 'http://www.w3.org/2000/svg';
      const slot = name => root.querySelector(`[data-slot="${name}"]`);
      const element = (tag, className, text) => {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (text) el.textContent = text;
        return el;
      };
      const icon = (name, className = '') => {
        const el = element('i', className);
        el.dataset.lucide = name;
        el.setAttribute('aria-hidden', 'true');
        return el;
      };
      const makeSvg = (tag, attrs) => {
        const el = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([name, value]) => el.setAttribute(name, value));
        return el;
      };
      const hydrateIcons = () => { if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } }); };
      const addDetail = (container, label, text) => {
        if (!text) return;
        const dl = element('dl'); dl.append(element('dt', '', label), element('dd', '', text)); container.append(dl);
      };
      const makeNode = id => {
        const node = nodeMap.get(id);
        if (!node) throw new Error(`Unknown brief activity: ${id}`);
        const wrapper = element('div', 'pb-node');
        wrapper.dataset.node = id;
        wrapper.dataset.state = node.state;
        const suppliedStage = node.developmentState;
        const hasStage = Object.hasOwn(developmentIcons, suppliedStage);
        const hasStageText = typeof node.developmentText === 'string' && node.developmentText.trim();
        const development = hasStage && (suppliedStage === 'not_applicable' || hasStageText) ? suppliedStage : 'unknown';
        wrapper.dataset.development = development;
        const details = element('details', 'card');
        details.dataset.disclosure = id;
        const summary = element('summary', 'pb-summary cursor-interaction');
        const meta = element('div', 'pb-meta');
        const type = element('span', 'pb-type text-small');
        type.append(icon(icons[node.kind] || icons.unknown), element('span', '', node.typeLabel));
        meta.append(type);
        const lifecycle = element('div', 'pb-lifecycle');
        const dimension = (label, value, symbol, className) => {
          const row = element('div', `pb-lifecycle-row ${className}`);
          const caption = element('span', 'pb-dimension-label text-small');
          const mark = element('span', 'pb-status-symbol'); mark.append(icon(symbol));
          caption.append(mark, element('span', '', label));
          row.append(caption, element('span', 'pb-dimension-value', value));
          return row;
        };
        if (development !== 'not_applicable') {
          const value = development === 'unknown' ? brief.unknownDevelopmentLabel : node.developmentText;
          lifecycle.append(dimension(node.developmentDimensionLabel || brief.developmentLabel, value, developmentIcons[development], 'pb-development'));
        }
        lifecycle.append(dimension(node.executionDimensionLabel || brief.executionLabel, node.stateLabel, executionIcons[node.state] || executionIcons.unknown, 'pb-state'));
        const disclosure = element('span', 'pb-disclosure text-small');
        disclosure.append(element('span', '', brief.detailsLabel), icon('chevron-down', 'pb-chevron'));
        summary.append(meta, element('strong', 'pb-title', node.title), lifecycle, disclosure);
        const content = element('div', 'pb-detail');
        addDetail(content, brief.builtLabel, node.built);
        addDetail(content, brief.buildRemainingLabel, node.buildRemaining);
        addDetail(content, brief.nextLabel, node.next);
        addDetail(content, brief.whyLabel, node.why);
        addDetail(content, brief.chatLabel, node.chat);
        if (node.evidence) {
          const evidence = element('details', 'pb-evidence text-small');
          evidence.append(element('summary', 'cursor-interaction', brief.evidenceLabel), element('p', '', node.evidence));
          content.append(evidence);
        }
        details.append(summary, content); wrapper.append(details);
        wrappers.set(id, wrapper);
        return wrapper;
      };
      [['context', brief.context], ['goal-label', brief.goalLabel], ['goal', brief.goal], ['flow-title', brief.flowTitle], ['legend', brief.legend], ['coverage-label', brief.coverageLabel], ['coverage', brief.coverage], ['accessible-summary', brief.accessibleSummary]].forEach(([name, value]) => { slot(name).textContent = value; });
      if (brief.example && !brief.context.includes(brief.exampleLabel)) slot('context').textContent += ` · ${brief.exampleLabel}`;

        ids.forEach(id => row.append(makeNode(id))); rows.append(row);
      });
      brief.support.forEach(group => {
        const details = element('details', 'pb-support');
        details.dataset.disclosure = `support-${group.id}`;
        const summary = element('summary', 'cursor-interaction');
        const title = element('span', 'pb-support-title'); title.append(icon(group.icon), element('span', '', group.title)); summary.append(title);

        details.append(summary, items); slot('support').append(details);

        const bounds = graph.getBoundingClientRect();
        const positions = new Map();
        brief.rows.flat().forEach(id => {
          const box = wrappers.get(id).getBoundingClientRect();
          positions.set(id, { x: box.x - bounds.x, y: box.y - bounds.y, w: box.width, h: box.height });
        });
        svg.setAttribute('width', bounds.width); svg.setAttribute('height', bounds.height);
        svg.setAttribute('viewBox', `0 0 ${bounds.width} ${bounds.height}`); svg.replaceChildren();

        const marker = makeSvg('marker', { id: 'pb-dependency-arrow', markerWidth: 8, markerHeight: 8, refX: 6, refY: 4, orient: 'auto' });
        marker.append(makeSvg('path', { d: 'M1 1 L6 4 L1 7', fill: 'none', stroke: 'var(--muted-foreground)', 'stroke-width': 1.3 }));
        defs.append(marker); svg.append(defs);
        brief.edges.forEach(([from, to]) => {
          const a = positions.get(from), b = positions.get(to);
          if (!a || !b) throw new Error(`Dependency endpoint missing from primary map: ${from} -> ${to}`);
          const x1 = a.x + a.w / 2, y1 = a.y + a.h + 3, x2 = b.x + b.w / 2, y2 = b.y - 5;
          const obstruction = [...positions].some(([id, p]) => id !== from && id !== to && p.y >= y1 && p.y < y2 && x1 >= p.x - 8 && x1 <= p.x + p.w + 8);
          const middle = y1 + (y2 - y1) / 2;
          const side = x1 < bounds.width / 2 ? 5 : bounds.width - 5;
          const d = obstruction ? `M${x1} ${y1} V${y1 + 12} H${side} V${y2 - 13} H${x2} V${y2}` : `M${x1} ${y1} V${middle} H${x2} V${y2}`;
          svg.append(makeSvg('path', { d, class: 'pb-edge', 'marker-end': 'url(#pb-dependency-arrow)' }));
        });
      };
      const applyState = state => {
        const saved = state?.privateContent?.projectVisualBrief;
        if (saved?.key !== brief.key || !Array.isArray(saved.open)) return;
        root.querySelectorAll('[data-disclosure]').forEach(el => { el.open = saved.open.includes(el.dataset.disclosure); });
      };
      const save = () => {
